<!DOCTYPE html>
<html lang="es-AR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente Forrajeria</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <button id="chatbot-toggle" class="chatbot-toggle" aria-label="Abrir asistente virtual">
        <i class="fa-solid fa-wheat-awn" aria-hidden="true"></i>
    </button>

    <div id="chatbot-window" class="chatbot-window hidden" aria-label="Asistente virtual">
        <div class="chatbot-header">
            <div class="header-info">
                <i class="fa-solid fa-tractor" aria-hidden="true"></i>
                <div><h3>Asistente Virtual</h3><p>Forrajeria El Remanso</p></div>
            </div>
            <div class="header-actions">
                <button id="chatbot-clear" title="Limpiar chat" aria-label="Limpiar chat"><i class="fa-solid fa-trash-can" aria-hidden="true"></i></button>
                <button id="chatbot-close" title="Cerrar" aria-label="Cerrar chat"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
            </div>
        </div>

        <div id="chatbot-messages" class="chatbot-messages">
            <div class="message bot"><div class="message-content">Hola. Soy el asistente virtual de nuestra forrajeria.<br>En que puedo ayudarte hoy?</div></div>
            <div id="quick-replies" class="quick-replies">
                <button class="quick-btn" data-message="Alimentos para perros">Alimentos para perros</button>
                <button class="quick-btn" data-message="Alimentos para gatos">Alimentos para gatos</button>
                <button class="quick-btn" data-message="Productos para caballos">Productos para caballos</button>
                <button class="quick-btn" data-message="Forrajes y semillas">Forrajes y semillas</button>
                <button class="quick-btn" data-message="Envios y pedidos">Envios y pedidos</button>
            </div>
        </div>

        <form class="chatbot-input" id="chatbot-form">
            <input type="text" id="chatbot-input-field" placeholder="Escribi tu consulta aca..." autocomplete="off" maxlength="500">
            <button id="chatbot-send" type="submit" aria-label="Enviar mensaje"><i class="fa-solid fa-paper-plane" aria-hidden="true"></i></button>
        </form>
    </div>
    <script src="app.js"></script>
</body>
</html>
